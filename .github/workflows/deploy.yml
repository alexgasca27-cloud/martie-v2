name: Deploy Martie 2.0 (manual fallback)

on:
  workflow_dispatch:

concurrency:
  group: martie-v2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6e0b72b5b6337ab29566219eb8dbde4e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply Martie v2 D1 migrations
        run: npx wrangler d1 migrations apply martie-v2-db --remote
      - name: Deploy Martie v2 Worker
        run: npx wrangler deploy
