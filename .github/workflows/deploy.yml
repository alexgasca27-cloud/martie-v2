name: Deploy Martie 2.0

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build Cloudflare config
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const id=process.env.D1_DATABASE_ID;
          if(!id) throw new Error('Missing CLOUDFLARE_D1_DATABASE_ID');
          const cfg={
            name:'martie-v2',
            main:'src/index.ts',
            compatibility_date:'2026-09-09',
            assets:{binding:'ASSETS',directory:'./public',not_found_handling:'single-page-application'},
            d1_databases:[{binding:'DB',database_name:'martie-v2',database_id:id,migrations_dir:'database/migrations'}],
            observability:{enabled:true}
          };
          fs.writeFileSync('wrangler.deploy.json',JSON.stringify(cfg,null,2));
          NODE
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply martie-v2 --remote --config wrangler.deploy.json
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.deploy.json
